name: CI

# ── PR + main/development push CI ──────────────────────────────────────────
#
# Bu workflow analiz, test ve debug sanity build'leri çalıştırır.
# Release/store upload süreci ayrı dosyada: `.github/workflows/release.yml`
# (sadece `v*` tag push'larında tetiklenir).
#
# Versiyon: `pubspec.yaml`'dan okunur (yalnızca CI display + debug build için).
# Resmi sürüm numarası release'de tag adından gelir.
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_BUNDLE_ID: "com.saydin.saydin"

jobs:
  # ── Versiyon (sadece display + debug build için) ───────────────────────────
  version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
      build_number: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        name: Read pubspec.yaml version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "❌ pubspec.yaml içinde version alanı bulunamadı"
            exit 1
          fi
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "ℹ️  pubspec.yaml versiyonu: $VERSION (CI display)"

  # ── Analyze + Test ─────────────────────────────────────────────────────────
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter test
        run: flutter test --coverage

      - name: Coverage özeti
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "⚠️ coverage/lcov.info bulunamadı" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          TOTAL_LINES=0
          HIT_LINES=0
          while IFS= read -r line; do
            case "$line" in
              LF:*) TOTAL_LINES=$((TOTAL_LINES + ${line#LF:})) ;;
              LH:*) HIT_LINES=$((HIT_LINES + ${line#LH:})) ;;
            esac
          done < coverage/lcov.info

          if [ "$TOTAL_LINES" -gt 0 ]; then
            LINE_PCT=$(echo "scale=1; $HIT_LINES * 100 / $TOTAL_LINES" | bc)
          else
            LINE_PCT="0.0"
          fi

          echo "## 🧪 Saydin.Client — Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Line   | ${LINE_PCT}% ($HIT_LINES / $TOTAL_LINES) |" >> $GITHUB_STEP_SUMMARY

          echo "✅ Line: ${LINE_PCT}% ($HIT_LINES / $TOTAL_LINES)"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ── Dependency Vulnerability Scan (F-02-10) ────────────────────────────────
  # pub.dev paketlerini ve diğer SBOM'da görünen ekosistem'leri OSV.dev
  # database'ine karşı tarar. Yeni CVE'ler yayınlandığında erken sinyal.
  #
  # `continue-on-error: true` ile build merge gate'i yapılmaz (yayın
  # vermenden önce CVE detayını insan değerlendirir) ama bulgular adım
  # exit code'una rağmen GitHub Step Summary'e yazılır → reviewer PR
  # ekranında görünür hale gelir.
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run osv-scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        with:
          scan-args: |-
            --recursive
            --skip-git
            --format=table
            --output=osv-report.txt
            ./
        continue-on-error: true

      - name: Publish OSV findings to Step Summary
        if: always()
        run: |
          {
            echo "## 🛡️ OSV Vulnerability Scan"
            echo ""
            if [ "${{ steps.osv.outcome }}" = "success" ]; then
              echo "✅ **No vulnerabilities found** in dependencies."
            else
              echo "⚠️ **Vulnerabilities detected** — review before merge."
              echo ""
              echo '```'
              if [ -f osv-report.txt ]; then
                cat osv-report.txt
              else
                echo "(osv-report.txt missing — runner failed before output)"
              fi
              echo '```'
              echo ""
              echo "Action: triage findings; bump or pin affected package."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OSV report artifact
        if: always() && hashFiles('osv-report.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: osv-report-${{ github.sha }}
          path: osv-report.txt
          retention-days: 14

  # ── Android Debug Build (PR + development push — sanity) ──────────────────
  build-android:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    needs: [version, analyze-and-test]
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/development')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Pre-install CMake
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1"

      - name: Build APK (debug)
        run: |
          flutter build apk --debug \
            --build-name=${{ needs.version.outputs.version_name }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            --dart-define=API_BASE_URL=${{ vars.API_URL_STAGING }} \
            --dart-define=APP_ENV=development

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saydin-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ── iOS Debug Build (PR + development push — sanity) ──────────────────────
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-15
    needs: [version, analyze-and-test]
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/development')

    steps:
      - uses: actions/checkout@v4

      # Apple ITMS-90725: 28 Nisan 2026'dan itibaren App Store Connect
      # iOS 26 SDK altında derlenmiş build'leri reddediyor.
      - name: Pin Xcode version for iOS 26 SDK (ITMS-90725)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --debug --no-codesign \
            --build-name=${{ needs.version.outputs.version_name }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            --dart-define=API_BASE_URL=${{ vars.API_URL_STAGING }} \
            --dart-define=APP_ENV=development
