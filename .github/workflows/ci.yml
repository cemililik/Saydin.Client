name: CI

# ── PR + main/development push CI ──────────────────────────────────────────
#
# Bu workflow analiz, test ve debug sanity build'leri çalıştırır.
# Release/store upload süreci ayrı dosyada: `.github/workflows/release.yml`
# (sadece `v*` tag push'larında tetiklenir).
#
# Versiyon: `pubspec.yaml`'dan okunur (yalnızca CI display + debug build için).
# Resmi sürüm numarası release'de tag adından gelir.
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IOS_BUNDLE_ID: "com.saydin.saydin"

permissions:
  contents: read

jobs:
  # ── Versiyon (sadece display + debug build için) ───────────────────────────
  version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.ver.outputs.version_name }}
      build_number: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: ver
        name: Read pubspec.yaml version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "❌ pubspec.yaml içinde version alanı bulunamadı"
            exit 1
          fi
          # GUVENLIK: pubspec.yaml fork PR'da saldirgan-kontrollu. `tr -d`
          # sadece boslugu eler; command substitution / IFS dizimi gecer. Bu
          # cikti downstream build adimlarinda build-name argumani olarak
          # run: blokuna interpole edildigi icin (fork PR tetikleyicisi
          # pull_request) format dogrulanmazsa command injection olur.
          # NOT: bu satirlar run: bloku icinde; Actions sablon ifadelerini
          # burada da degerlendirir, o yuzden yorumda template sozdizimi yok.
          # Strict numeric guard:
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Geçersiz pubspec versiyon formatı: $VERSION (beklenen: X.Y.Z)"
            exit 1
          fi
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ℹ️  pubspec.yaml versiyonu: $VERSION (CI display)"

  # ── Analyze + Test ─────────────────────────────────────────────────────────
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate ARB locale contract
        run: python3 tool/quality/validate_arb_contract.py

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Legal release gate unit tests
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py'

      - name: Verify coverage source manifest
        run: python3 tool/quality/generate_coverage_imports.py --check

      - name: Verify generated l10n is committed
        run: |
          if ! git diff --exit-code -- lib/l10n/app_localizations.dart lib/l10n/app_localizations_*.dart; then
            echo "❌ flutter gen-l10n çıktısı commit'li dosyalarla uyuşmuyor."
            exit 1
          fi

      - name: Dart format check
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter test
        run: flutter test --coverage

      - name: Coverage gate and summary
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          coverage_args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if ! printf '%s' "$PR_BASE_SHA" | grep -Eq '^[a-f0-9]{40}$'; then
              echo "Pull request base SHA is missing or invalid" >&2
              exit 1
            fi
            coverage_patch="$RUNNER_TEMP/coverage.patch"
            git diff --unified=0 --no-ext-diff "$PR_BASE_SHA" -- lib > "$coverage_patch"
            coverage_args+=(--patch-file "$coverage_patch")
          fi
          {
            echo "## Test Coverage"
            echo ""
            echo '```text'
            python3 tool/quality/coverage_gate.py "${coverage_args[@]}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true

  # ── Non-Dart quality ───────────────────────────────────────────────────────────
  # Python fixture, agent contract, docs/link, YAML, actionlint ve shellcheck.
  non-dart-quality:
    name: Non-Dart Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Quality validator unit fixtures
        run: python3 -m unittest discover -s tool/quality/tests -p 'test_*.py' -v

      - name: Release evidence generator unit tests
        run: ruby tool/tests/test_generate_release_evidence.rb

      - name: Repository agent and documentation contracts
        run: python3 tool/quality/validate_repo_contracts.py

      - name: Parse YAML files
        run: |
          git ls-files -z '*.yml' '*.yaml' |
            xargs -0 ruby -e 'require "yaml"; ARGV.each { |path| abort("Empty YAML: #{path}") unless YAML.parse_file(path) }'

      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: ShellCheck repository scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  # Tracked files deterministik kuralla, Git history gitleaks ile taranır.
  secret-scan:
    name: Secret & History Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deterministic tracked-file guard
        run: git ls-files -z | python3 tool/quality/scan_tracked_secrets.py --paths-from-stdin

      - name: Gitleaks history scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Haftalık schedule repo değişmese de yeni advisory'leri yakalar. CVSS >= 7
  # ve bilinmeyen severity fail-closed; daha düşük severity raporlanır.
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run osv-scanner
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            --format=json
            --output=osv-report.json
            ./

      - name: Apply high/critical vulnerability policy
        if: always()
        run: >-
          python3 tool/quality/verify_osv_report.py osv-report.json
          --threshold 7.0
          --summary osv-policy-summary.md

      - name: Publish dependency policy summary
        if: always()
        run: |
          if [ -f osv-policy-summary.md ]; then
            cat osv-policy-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dependency policy summary missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload OSV report artifact
        if: always() && hashFiles('osv-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: osv-report-${{ github.sha }}
          path: osv-report.json
          # Aynı içerik zaten Step Summary'de (run ile saklanır); artifact
          retention-days: 1

  # ── Android Debug Build (PR + development push — sanity) ──────────────────
  build-android:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest
    needs: [version, analyze-and-test]
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/development')

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Pre-install CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"

      - name: Build APK (debug)
        # Defense-in-depth: version job zaten format doğruluyor, ama
        # template değerleri intermediate env var üzerinden geçirilip
        # `run:`'a doğrudan interpole edilmez (GitHub güvenlik tavsiyesi).
        env:
          BUILD_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          API_URL: ${{ vars.API_URL_STAGING }}
        run: |
          flutter build apk --debug \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=APP_ENV=development

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saydin-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ── iOS Debug Build (PR + development push — sanity) ──────────────────────
  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-15
    needs: [version, analyze-and-test]
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/development')

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Apple ITMS-90725: 28 Nisan 2026'dan itibaren App Store Connect
      # iOS 26 SDK altında derlenmiş build'leri reddediyor.
      - name: Pin Xcode version for iOS 26 SDK (ITMS-90725)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build iOS (no codesign)
        # Defense-in-depth: bkz. Build APK adımı — intermediate env var.
        env:
          BUILD_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          API_URL: ${{ vars.API_URL_STAGING }}
        run: |
          flutter build ios --debug --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=APP_ENV=development
