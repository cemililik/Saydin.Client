# Dependabot — Saydın Client bağımlılık otomasyonu (F-02-10).
#
# pub.dev için resmi destek henüz yok; pub bağımlılıkları osv-scanner
# step'i (`ci.yml`) ile haftalık taranıyor. Burada native (Gradle, Pods)
# ve GitHub Actions sürümleri Dependabot ile haftalık güncellenir.
#
# Strateji: minor/patch PR'larını otomatik aç, major'ı insan onayı için
# beklet ("ignore" ile filtre).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: bundler
    directory: /ios
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ios
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
