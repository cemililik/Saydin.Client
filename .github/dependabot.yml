# Dependabot — Saydın Client bağımlılık otomasyonu (F-02-10).
#
# pub.dev ve CocoaPods için Dependabot package-ecosystem desteği yoktur.
# Lockfile'lar `ci.yml` OSV policy job'uyla her PR/push ve haftalık schedule'da
# taranır. GitHub Actions ile Gradle update PR'ları burada yönetilir; Flutter/pub
# ve Flutter tarafından üretilen Pod update akışı için
# `docs/dependency-security-runbook.md` izlenir.
#
# Strateji: minor/patch PR'larını otomatik aç, major'ı insan onayı için
# beklet ("ignore" ile filtre).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
